aid: lemfi
name: LemFi
description: >-
  LemFi (formerly Lemonade Finance) is a London-headquartered cross-border payments
  and remittance fintech built for immigrant communities, operating as a regulated
  Electronic Money Institution in the UK and as a FinCEN-registered money services
  business in the US through Pomelo Two US LLC (NMLS 2523778). Its consumer mobile
  apps let customers hold multi-currency balances, receive local bank details in
  their country of residence, request money, buy eSIM data, and send international
  transfers to 30+ receive markets across Africa, Asia, Europe and Latin America via
  direct integrations with tier-1 local banks. LemFi is a consumer-app company: as of
  this profile it publishes no developer portal, no public API reference, no OpenAPI
  or other machine-readable contract, no SDKs and no sandbox. What it does publish
  publicly is a Secureframe-hosted trust center naming SOC 2 Type II, PCI DSS Level 1,
  ISO 27001 and GDPR, and a formal vulnerability disclosure policy run through Inspectiv.
